          env_suffix=${target//-/_}
          env_upper=$(echo "$env_suffix" | tr '[:lower:]' '[:upper:]')
          export CC_${env_suffix}="${toolchain}/${clang_target}-clang"
          export CXX_${env_suffix}="${toolchain}/${clang_target}-clang++"
          export AR_${env_suffix}="${toolchain}/llvm-ar"
          export RANLIB_${env_suffix}="${toolchain}/llvm-ranlib"
          export CARGO_TARGET_${env_upper}_LINKER="${toolchain}/${clang_target}-clang"
          export CARGO_TARGET_${env_upper}_AR="${toolchain}/llvm-ar"
          export CARGO_TARGET_${env_upper}_RANLIB="${toolchain}/llvm-ranlib"
          export PKG_CONFIG_ALLOW_CROSS=1
