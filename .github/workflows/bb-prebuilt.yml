name: Build & Publish Barretenberg Prebuilts

on:
  push:
    tags:
      - "v*-usernode*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build/publish, including the leading v (e.g., v2.0.3-usernode.1)
        required: false
        default: ""
      publish:
        description: Publish release assets after building
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build prebuilts (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_tag: linux-x64
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            os_tag: linux-arm64
          - runner: ubuntu-22.04
            target: aarch64-linux-android
            os_tag: android-arm64
          - runner: ubuntu-22.04
            target: x86_64-linux-android
            os_tag: android-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            os_tag: macos-arm64
          - runner: macos-14
            target: aarch64-apple-ios-sim
            os_tag: ios-sim-arm64
          - runner: macos-14
            target: aarch64-apple-ios
            os_tag: ios-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve crate version
        shell: bash
        run: |
          crypto_crate_version=$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' crates/aztec-barretenberg-crypto-sys-rs/Cargo.toml)
          prover_crate_version=$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' crates/aztec-barretenberg-sys-rs/Cargo.toml)
          wrapper_crate_version=$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' crates/aztec-barretenberg-rs/Cargo.toml)
          if [ -z "$crypto_crate_version" ] || [ -z "$prover_crate_version" ] || \
             [ -z "$wrapper_crate_version" ]; then
            echo "Failed to parse one or more Barretenberg crate versions" >&2
            exit 1
          fi
          if [ "$crypto_crate_version" != "$prover_crate_version" ] || \
             [ "$wrapper_crate_version" != "$prover_crate_version" ]; then
            echo "Barretenberg crate versions must match: crypto=$crypto_crate_version prover=$prover_crate_version wrapper=$wrapper_crate_version" >&2
            exit 1
          fi
          if [ -n "${{ inputs.version }}" ]; then
            version_tag='${{ inputs.version }}'
          elif [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            version_tag='${{ github.ref_name }}'
          else
            version_tag="v${prover_crate_version}"
          fi
          case "$version_tag" in
            v*) ;;
            *)
              echo "Prebuilt version must be a release tag beginning with v: $version_tag" >&2
              exit 1
              ;;
          esac
          if [ "${version_tag#v}" != "$prover_crate_version" ]; then
            echo "Requested prebuilt version $version_tag does not match crate version v$prover_crate_version" >&2
            exit 1
          fi
          echo "CRATE_VERSION=${version_tag#v}" >> $GITHUB_ENV
          echo "VERSION_TAG=${version_tag}" >> $GITHUB_ENV

      - name: Install LLVM/Clang 19 (Linux)
        if: runner.os == 'Linux' && !contains(matrix.target, 'linux-android')
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg ca-certificates cmake ninja-build build-essential pkg-config
          codename=$(lsb_release -sc)
          echo "Using Ubuntu codename: $codename"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-snapshot.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-19 main" | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19
          echo "CC=clang-19" >> $GITHUB_ENV
          echo "CXX=clang++-19" >> $GITHUB_ENV
          echo "BB_OBJCOPY=$(command -v llvm-objcopy-19)" >> $GITHUB_ENV

      - name: Install aarch64 cross toolchain (Linux, arm64 target)
        if: runner.os == 'Linux' && contains(matrix.target, 'aarch64') && !contains(matrix.target, 'android')
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu libstdc++-12-dev-arm64-cross
          echo "AR=/usr/bin/aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "RANLIB=/usr/bin/aarch64-linux-gnu-ranlib" >> $GITHUB_ENV

      - name: macOS SDK env
        if: runner.os == 'macOS' && !contains(matrix.target, 'ios')
        run: |
          brew update
          brew install cmake ninja llvm@19
          echo "PATH=$(brew --prefix llvm@19)/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "BB_OBJCOPY=$(brew --prefix llvm@19)/bin/llvm-objcopy" >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> $GITHUB_ENV

      - name: iOS simulator SDK env
        if: runner.os == 'macOS' && contains(matrix.target, 'ios-sim')
        run: |
          brew update
          brew install cmake ninja llvm@19
          echo "PATH=$(brew --prefix llvm@19)/bin:$PATH" >> $GITHUB_ENV
          echo "IOS_SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(brew --prefix llvm@19)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@19)/bin/clang++" >> $GITHUB_ENV
          echo "BB_OBJCOPY=$(brew --prefix llvm@19)/bin/llvm-objcopy" >> $GITHUB_ENV
          echo "CMAKE_OSX_SYSROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> $GITHUB_ENV
          echo "CMAKE_OSX_ARCHITECTURES=arm64" >> $GITHUB_ENV
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=13.0" >> $GITHUB_ENV

      - name: iOS device SDK env
        if: runner.os == 'macOS' && (matrix.target == 'aarch64-apple-ios')
        run: |
          brew update
          brew install cmake ninja llvm@19
          echo "PATH=$(brew --prefix llvm@19)/bin:$PATH" >> $GITHUB_ENV
          echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(brew --prefix llvm@19)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@19)/bin/clang++" >> $GITHUB_ENV
          echo "BB_OBJCOPY=$(brew --prefix llvm@19)/bin/llvm-objcopy" >> $GITHUB_ENV
          echo "CMAKE_OSX_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CMAKE_OSX_ARCHITECTURES=arm64" >> $GITHUB_ENV
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=13.0" >> $GITHUB_ENV

      - name: Configure (CMake + Ninja, Linux x86_64)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cmake -S barretenberg/cpp -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -GNinja \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_COMPILER=${{ env.CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DCMAKE_CXX_FLAGS="-Wno-error=shorten-64-to-32" \
            -DBB_LITE=ON \
            -DAVM=OFF \
            -DENABLE_TRACY=OFF \
            -DMULTITHREADING=ON

      - name: Configure (CMake + Ninja, Linux aarch64 cross)
        if: runner.os == 'Linux' && contains(matrix.target, 'aarch64') && !contains(matrix.target, 'android')
        run: |
          cmake -S barretenberg/cpp -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -GNinja \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DTARGET_ARCH=generic \
            -DCMAKE_C_COMPILER=${{ env.CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
            -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
            -DCMAKE_AR=${{ env.AR }} \
            -DCMAKE_RANLIB=${{ env.RANLIB }} \
            -DCMAKE_C_FLAGS="--target=aarch64-linux-gnu" \
            -DCMAKE_CXX_FLAGS="--target=aarch64-linux-gnu -Wno-error=shorten-64-to-32" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBB_LITE=ON \
            -DAVM=OFF \
            -DENABLE_TRACY=OFF \
            -DMULTITHREADING=ON

      - name: Install Android NDK (Linux, Android targets)
        if: runner.os == 'Linux' && contains(matrix.target, 'linux-android')
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl
          NDK_VERSION=r26d
          NDK_ZIP=android-ndk-${NDK_VERSION}-linux.zip
          curl -fsSL https://dl.google.com/android/repository/${NDK_ZIP} -o ${NDK_ZIP}
          unzip -q ${NDK_ZIP} -d $HOME
          rm -f ${NDK_ZIP}
          ndk_dir=$(echo $HOME/android-ndk-*)
          api=28
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              abi=arm64-v8a
              bb_arm=ON
              bb_target_arch=""
              clang_target="aarch64-linux-android${api}"
              ;;
            x86_64-linux-android)
              abi=x86_64
              bb_arm=""
              bb_target_arch="x86-64"
              clang_target="x86_64-linux-android${api}"
              ;;
            *)
              echo "Unsupported Android target ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          echo "ANDROID_NDK=$ndk_dir" >> $GITHUB_ENV
          echo "ANDROID_ABI=$abi" >> $GITHUB_ENV
          echo "ANDROID_API=$api" >> $GITHUB_ENV
          echo "ANDROID_CLANG_TARGET=$clang_target" >> $GITHUB_ENV
          if [ -n "$bb_target_arch" ]; then
            echo "BB_TARGET_ARCH=$bb_target_arch" >> $GITHUB_ENV
          fi
          if [ -n "$bb_arm" ]; then
            echo "BB_ARM=$bb_arm" >> $GITHUB_ENV
          fi
          echo "CC=$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> $GITHUB_ENV
          echo "CXX=$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" >> $GITHUB_ENV
          echo "BB_OBJCOPY=$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy" >> $GITHUB_ENV

      - name: Configure (CMake + Ninja, Android)
        if: runner.os == 'Linux' && contains(matrix.target, 'linux-android')
        run: |
          target_arch_arg=""
          arm_arg=""
          if [ -n "${BB_TARGET_ARCH:-}" ]; then
            target_arch_arg="-DTARGET_ARCH=${BB_TARGET_ARCH}"
          fi
          if [ -n "${BB_ARM:-}" ]; then
            arm_arg="-DARM=${BB_ARM}"
          fi
          cmake -S barretenberg/cpp -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -GNinja \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_API}" \
            ${target_arch_arg} \
            ${arm_arg} \
            -DBB_LITE=ON \
            -DAVM=OFF \
            -DENABLE_TRACY=OFF \
            -DMULTITHREADING=ON

      - name: Configure (CMake + Ninja, macOS)
        if: runner.os == 'macOS' && !contains(matrix.target, 'ios')
        run: |
          cmake -S barretenberg/cpp -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -GNinja \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_COMPILER=${{ env.CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DBB_LITE=ON \
            -DAVM=OFF \
            -DENABLE_TRACY=OFF \
            -DMULTITHREADING=ON

      - name: Configure (CMake + Ninja, iOS simulator arm64)
        if: runner.os == 'macOS' && contains(matrix.target, 'ios-sim')
        run: |
          # Provide compat header for iOS SDK missing sys/random.h
          mkdir -p $PWD/build/compat/sys
          cat > $PWD/build/compat/sys/random.h << 'EOF'
          #pragma once
          #include <stddef.h>
          #include <stdint.h>
          #include <stdlib.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          static inline int getentropy(void* buf, size_t buflen) {
            arc4random_buf(buf, buflen);
            return 0;
          }
          static inline ssize_t getrandom(void* buf, size_t buflen, unsigned int /*flags*/) {
            arc4random_buf(buf, buflen);
            return (ssize_t)buflen;
          }
          #ifdef __cplusplus
          }
          #endif
          EOF
          cmake -S barretenberg/cpp -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -GNinja \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.CMAKE_OSX_ARCHITECTURES }} \
            -DCMAKE_OSX_SYSROOT=${{ env.CMAKE_OSX_SYSROOT }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.CMAKE_OSX_DEPLOYMENT_TARGET }} \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DARM=ON \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios-simulator \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios-simulator \
            -DBB_LITE=ON \
            -DCMAKE_C_FLAGS="-isystem $PWD/build/compat" \
            -DCMAKE_CXX_FLAGS="-isystem $PWD/build/compat" \
            -DCMAKE_C_COMPILER=${{ env.CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DAVM=OFF \
            -DENABLE_TRACY=OFF \
            -DMULTITHREADING=ON

      - name: Configure (CMake + Ninja, iOS device arm64)
        if: runner.os == 'macOS' && matrix.target == 'aarch64-apple-ios'
        run: |
          # Provide compat header for iOS SDK missing sys/random.h
          mkdir -p $PWD/build/compat/sys
          cat > $PWD/build/compat/sys/random.h << 'EOF'
          #pragma once
          #include <stddef.h>
          #include <stdint.h>
          #include <stdlib.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          static inline int getentropy(void* buf, size_t buflen) {
            arc4random_buf(buf, buflen);
            return 0;
          }
          static inline ssize_t getrandom(void* buf, size_t buflen, unsigned int /*flags*/) {
            arc4random_buf(buf, buflen);
            return (ssize_t)buflen;
          }
          #ifdef __cplusplus
          }
          #endif
          EOF
          cmake -S barretenberg/cpp -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -GNinja \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=${{ env.CMAKE_OSX_ARCHITECTURES }} \
            -DCMAKE_OSX_SYSROOT=${{ env.CMAKE_OSX_SYSROOT }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.CMAKE_OSX_DEPLOYMENT_TARGET }} \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DARM=ON \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios \
            -DBB_LITE=ON \
            -DCMAKE_C_FLAGS="-isystem $PWD/build/compat" \
            -DCMAKE_CXX_FLAGS="-isystem $PWD/build/compat" \
            -DCMAKE_C_COMPILER=${{ env.CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DAVM=OFF \
            -DENABLE_TRACY=OFF \
            -DMULTITHREADING=ON

      - name: Build split static libraries
        run: |
          cmake --build build --target \
            bb-crypto-external \
            bb_rust_crypto_api \
            bb-prover-external \
            bb_rust_prover_api

      - name: Verify PIC flags (Linux)
        if: runner.os == 'Linux' && !contains(matrix.target, 'android')
        shell: bash
        run: |
          set -euo pipefail
          libs=(
            libbb-crypto-external.a
            libbb_rust_crypto_api.a
            libbb-prover-external.a
            libbb_rust_prover_api.a
          )
          for lib in "${libs[@]}"; do
            path="build/lib/${lib}"
            if [ ! -f "$path" ]; then
              echo "Missing library for PIC verification: $path" >&2
              exit 1
            fi
            flags=$(mktemp -t objdump-flags.XXXXXX)
            objdump -f "$path" > "$flags"
            if grep -q "EXEC_P" "$flags"; then
              echo "Found EXEC_P flag in $lib" >&2
              cat "$flags" >&2
              exit 1
            fi
            if ! grep -q "HAS_RELOC" "$flags"; then
              echo "Missing HAS_RELOC flag in $lib" >&2
              cat "$flags" >&2
              exit 1
            fi
            rm -f "$flags"
          done

      - name: Build C++ shim archives (macOS fallback)
        if: runner.os == 'macOS' && !contains(matrix.target, 'ios')
        shell: bash
        run: |
          set -euxo pipefail
          cxx="${CXX:-clang++}"
          inc1="barretenberg/cpp/src"
          inc2="build/_deps/msgpack-c/src/msgpack-c/include"
          inc3="build/_deps/tracy-src/public"
          mkdir -p build/lib
          for component in crypto prover; do
            archive="build/lib/libbb_rust_${component}_api.a"
            if [ -f "$archive" ]; then
              echo "$(basename "$archive") already present"
              continue
            fi
            source="barretenberg/cpp/src/bb_rust_${component}_api.cpp"
            object="build/bb_rust_${component}_api.o"
            "$cxx" -std=c++20 -fPIC -fvisibility=hidden -O2 -Wno-error \
              -I"$inc1" -I"$inc2" -I"$inc3" \
              -c "$source" -o "$object"
            libtool -static -o "$archive" "$object"
          done

      - name: Package prebuilts
        shell: bash
        run: |
          set -euxo pipefail
          target='${{ matrix.target }}'
          version='${{ env.VERSION_TAG }}'
          crypto_staging="staging-crypto"
          prover_staging="staging-prover"
          crypto_debug_staging="staging-crypto-debug"
          prover_debug_staging="staging-prover-debug"
          rm -rf \
            "$crypto_staging" \
            "$prover_staging" \
            "$crypto_debug_staging" \
            "$prover_debug_staging"
          mkdir -p \
            "$crypto_staging/lib" \
            "$prover_staging/lib" \
            "$prover_staging/include" \
            "$prover_staging/include-deps/msgpack"
          cp -a barretenberg/cpp/src/. "$prover_staging/include/"
          cp -a build/_deps/msgpack-c/src/msgpack-c/include/. "$prover_staging/include-deps/msgpack/" || true
          # Keep include-deps explicit for Cargo metadata, and mirror msgpack into include/
          # so Barretenberg public headers remain self-contained for downstream C++ shims.
          cp -a build/_deps/msgpack-c/src/msgpack-c/include/. "$prover_staging/include/" || true
          for lib in libbb-crypto-external.a libbb_rust_crypto_api.a; do
            if [ ! -f "build/lib/$lib" ]; then
              echo "Missing expected crypto library: $lib" >&2
              exit 1
            fi
            cp -a "build/lib/$lib" "$crypto_staging/lib/"
          done
          for lib in libbb-prover-external.a libbb_rust_prover_api.a; do
            if [ ! -f "build/lib/$lib" ]; then
              echo "Missing expected prover library: $lib" >&2
              exit 1
            fi
            cp -a "build/lib/$lib" "$prover_staging/lib/"
          done
          # Keep the unstripped RelWithDebInfo archives as a separate diagnostic
          # asset, while normal consumers get the exact same optimized objects
          # without their native DWARF sections.
          cp -a "$crypto_staging" "$crypto_debug_staging"
          cp -a "$prover_staging" "$prover_debug_staging"
          if [ -z "${BB_OBJCOPY:-}" ] || [ ! -x "$BB_OBJCOPY" ]; then
            echo "BB_OBJCOPY does not name an executable LLVM objcopy" >&2
            exit 1
          fi
          unstripped_bytes=0
          stripped_bytes=0
          archives=(
            "$crypto_staging/lib/libbb-crypto-external.a"
            "$crypto_staging/lib/libbb_rust_crypto_api.a"
            "$prover_staging/lib/libbb-prover-external.a"
            "$prover_staging/lib/libbb_rust_prover_api.a"
          )
          for archive in "${archives[@]}"; do
            stripped="${archive}.stripped"
            unstripped_bytes=$((unstripped_bytes + $(wc -c < "$archive")))
            "$BB_OBJCOPY" --strip-debug "$archive" "$stripped"
            mv "$stripped" "$archive"
            stripped_bytes=$((stripped_bytes + $(wc -c < "$archive")))
          done
          if [ "$stripped_bytes" -ge "$unstripped_bytes" ]; then
            echo "Stripping native debug sections did not reduce archive size" >&2
            exit 1
          fi
          echo "Native archives: $unstripped_bytes bytes -> $stripped_bytes bytes"
          crypto_symbols=$(mktemp -t crypto-symbols.XXXXXX)
          prover_symbols=$(mktemp -t prover-symbols.XXXXXX)
          nm -g "$crypto_staging/lib/libbb_rust_crypto_api.a" > "$crypto_symbols"
          nm -g "$prover_staging/lib/libbb_rust_prover_api.a" > "$prover_symbols"
          grep -q 'bb_poseidon2_permutation_bn254' "$crypto_symbols" || \
            { echo "ERROR: libbb_rust_crypto_api.a missing bb_poseidon2_permutation_bn254" >&2; exit 1; }
          grep -q 'srs_init_srs' "$prover_symbols" || \
            { echo "ERROR: libbb_rust_prover_api.a missing srs_init_srs" >&2; exit 1; }
          grep -q 'srs_init_grumpkin_srs' "$prover_symbols" || \
            { echo "ERROR: libbb_rust_prover_api.a missing srs_init_grumpkin_srs" >&2; exit 1; }
          rm -f "$crypto_symbols" "$prover_symbols"
          for directory in \
            "$crypto_staging" \
            "$prover_staging" \
            "$crypto_debug_staging" \
            "$prover_debug_staging"; do
            echo "$version" > "$directory/VERSION"
          done
          crypto_asset="barretenberg-crypto-${version}-${target}.tar.gz"
          prover_asset="barretenberg-prover-${version}-${target}.tar.gz"
          crypto_debug_asset="barretenberg-crypto-debug-${version}-${target}.tar.gz"
          prover_debug_asset="barretenberg-prover-debug-${version}-${target}.tar.gz"
          tar -czf "$crypto_asset" -C "$crypto_staging" .
          tar -czf "$prover_asset" -C "$prover_staging" .
          tar -czf "$crypto_debug_asset" -C "$crypto_debug_staging" .
          tar -czf "$prover_debug_asset" -C "$prover_debug_staging" .

          validate_crypto_asset() {
            local asset="$1"
            local listfile
            listfile=$(mktemp -t tarlist.XXXXXX)
            tar -tzf "$asset" > "$listfile"
            grep -Eq '^(\./)?VERSION$' "$listfile" || { echo "ERROR: $asset missing VERSION" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?lib/libbb-crypto-external\.a$' "$listfile" || { echo "ERROR: $asset missing lib/libbb-crypto-external.a" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?lib/libbb_rust_crypto_api\.a$' "$listfile" || { echo "ERROR: $asset missing lib/libbb_rust_crypto_api.a" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?lib/libbb-(prover-)?external\.a$|^(\./)?lib/libbb_rust_(api|prover_api)\.a$' "$listfile" || { echo "ERROR: $asset unexpectedly contains combined/prover libraries" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?include(-deps)?/' "$listfile" || { echo "ERROR: $asset unexpectedly contains prover headers" >&2; cat "$listfile" >&2; exit 1; }
            rm -f "$listfile"
          }

          validate_prover_asset() {
            local asset="$1"
            local listfile
            listfile=$(mktemp -t tarlist.XXXXXX)
            tar -tzf "$asset" > "$listfile"
            grep -Eq '^(\./)?VERSION$' "$listfile" || { echo "ERROR: $asset missing VERSION" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?lib/libbb-prover-external\.a$' "$listfile" || { echo "ERROR: $asset missing lib/libbb-prover-external.a" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?lib/libbb_rust_prover_api\.a$' "$listfile" || { echo "ERROR: $asset missing lib/libbb_rust_prover_api.a" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?lib/libbb-(crypto-)?external\.a$|^(\./)?lib/libbb_rust_(api|crypto_api)\.a$' "$listfile" || { echo "ERROR: $asset unexpectedly contains combined/crypto libraries" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?include/barretenberg/ecc/curves/bn254/g1\.hpp$' "$listfile" || { echo "ERROR: $asset missing Barretenberg public headers" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?include/msgpack\.hpp$' "$listfile" || { echo "ERROR: $asset missing mirrored msgpack public headers" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?include-deps/msgpack/msgpack\.hpp$' "$listfile" || { echo "ERROR: $asset missing include-deps/msgpack" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?include/tracy/' "$listfile" || { echo "ERROR: $asset unexpectedly contains Tracy public headers" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?include-deps/tracy/' "$listfile" || { echo "ERROR: $asset unexpectedly contains include-deps/tracy" >&2; cat "$listfile" >&2; exit 1; }
            rm -f "$listfile"
          }

          validate_crypto_asset "$crypto_asset"
          validate_crypto_asset "$crypto_debug_asset"
          validate_prover_asset "$prover_asset"
          validate_prover_asset "$prover_debug_asset"
          echo "CRYPTO_ASSET=$crypto_asset" >> $GITHUB_ENV
          echo "PROVER_ASSET=$prover_asset" >> $GITHUB_ENV
          echo "CRYPTO_DEBUG_ASSET=$crypto_debug_asset" >> $GITHUB_ENV
          echo "PROVER_DEBUG_ASSET=$prover_debug_asset" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: barretenberg-split-${{ env.VERSION_TAG }}-${{ matrix.target }}
          path: |
            ${{ env.CRYPTO_ASSET }}
            ${{ env.PROVER_ASSET }}
            ${{ env.CRYPTO_DEBUG_ASSET }}
            ${{ env.PROVER_DEBUG_ASSET }}
          retention-days: 7

      # No separate 'latest' artifact; consumers fetch versioned assets by crate version

      # No SHA256SUMS generation/upload (build.rs does not verify)

  release:
    name: Publish release assets
    needs:
      - build
      - consumer-test
      - consumer-test-aarch64
      - consumer-test-android
      - consumer-test-macos
      - consumer-test-ios-sim
      - consumer-test-ios
    runs-on: ubuntu-latest
    # Run on tag push, or manual run with publish=true
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - name: Checkout (for tagging)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather files
        run: |
          set -euo pipefail
          ls -R artifacts
          mkdir -p out
          find artifacts -type f -name 'barretenberg-*.tar.gz' -exec cp {} out/ \;
          shopt -s nullglob
          files=(out/*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no prebuilt tarballs were downloaded" >&2
            exit 1
          fi

          validate_crypto_asset() {
            local asset="$1"
            local listfile
            listfile=$(mktemp -t tarlist.XXXXXX)
            tar -tzf "$asset" > "$listfile"
            grep -Eq '^(\./)?VERSION$' "$listfile" || { echo "ERROR: $asset missing VERSION" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?lib/libbb-crypto-external\.a$' "$listfile" || { echo "ERROR: $asset missing lib/libbb-crypto-external.a" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?lib/libbb_rust_crypto_api\.a$' "$listfile" || { echo "ERROR: $asset missing lib/libbb_rust_crypto_api.a" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?lib/libbb-(prover-)?external\.a$|^(\./)?lib/libbb_rust_(api|prover_api)\.a$' "$listfile" || { echo "ERROR: $asset unexpectedly contains combined/prover libraries" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?include(-deps)?/' "$listfile" || { echo "ERROR: $asset unexpectedly contains prover headers" >&2; cat "$listfile" >&2; exit 1; }
            rm -f "$listfile"
          }

          validate_prover_asset() {
            local asset="$1"
            local listfile
            listfile=$(mktemp -t tarlist.XXXXXX)
            tar -tzf "$asset" > "$listfile"
            grep -Eq '^(\./)?VERSION$' "$listfile" || { echo "ERROR: $asset missing VERSION" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?lib/libbb-prover-external\.a$' "$listfile" || { echo "ERROR: $asset missing lib/libbb-prover-external.a" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?lib/libbb_rust_prover_api\.a$' "$listfile" || { echo "ERROR: $asset missing lib/libbb_rust_prover_api.a" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?lib/libbb-(crypto-)?external\.a$|^(\./)?lib/libbb_rust_(api|crypto_api)\.a$' "$listfile" || { echo "ERROR: $asset unexpectedly contains combined/crypto libraries" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?include/barretenberg/ecc/curves/bn254/g1\.hpp$' "$listfile" || { echo "ERROR: $asset missing Barretenberg public headers" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?include/msgpack\.hpp$' "$listfile" || { echo "ERROR: $asset missing mirrored msgpack public headers" >&2; cat "$listfile" >&2; exit 1; }
            grep -Eq '^(\./)?include-deps/msgpack/msgpack\.hpp$' "$listfile" || { echo "ERROR: $asset missing include-deps/msgpack" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?include/tracy/' "$listfile" || { echo "ERROR: $asset unexpectedly contains Tracy public headers" >&2; cat "$listfile" >&2; exit 1; }
            ! grep -Eq '^(\./)?include-deps/tracy/' "$listfile" || { echo "ERROR: $asset unexpectedly contains include-deps/tracy" >&2; cat "$listfile" >&2; exit 1; }
            rm -f "$listfile"
          }

          # Validate each archive according to its component, keeping the
          # unstripped debug assets subject to the same package contract.
          for f in out/*.tar.gz; do
            echo "Checking $f"
            case "$(basename "$f")" in
              barretenberg-crypto-*.tar.gz)
                validate_crypto_asset "$f"
                ;;
              barretenberg-prover-*.tar.gz)
                validate_prover_asset "$f"
                ;;
              *)
                echo "ERROR: unexpected prebuilt asset name: $f" >&2
                exit 1
                ;;
            esac
          done

          # Each target must have a normal crypto/prover pair and both debug
          # counterparts before anything is attached to the release.
          normal_crypto_count=0
          for crypto in out/barretenberg-crypto-*.tar.gz; do
            case "$(basename "$crypto")" in
              barretenberg-crypto-debug-*.tar.gz) continue ;;
            esac
            normal_crypto_count=$((normal_crypto_count + 1))
            suffix=$(basename "$crypto")
            suffix=${suffix#barretenberg-crypto-}
            for counterpart in \
              "out/barretenberg-prover-${suffix}" \
              "out/barretenberg-crypto-debug-${suffix}" \
              "out/barretenberg-prover-debug-${suffix}"; do
              if [ ! -f "$counterpart" ]; then
                echo "ERROR: missing counterpart for $crypto: $counterpart" >&2
                exit 1
              fi
            done
          done
          if [ "$normal_crypto_count" -eq 0 ]; then
            echo "ERROR: no normal crypto assets found" >&2
            exit 1
          fi
          if [ "${#files[@]}" -ne $((normal_crypto_count * 4)) ]; then
            echo "ERROR: found ${#files[@]} assets for $normal_crypto_count target(s); expected four per target" >&2
            exit 1
          fi

      - name: Resolve crate version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version_tag='${{ inputs.version }}'
          elif [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            version_tag='${{ github.ref_name }}'
          else
            crate_version=$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' crates/aztec-barretenberg-sys-rs/Cargo.toml)
            version_tag="v${crate_version}"
          fi
          echo "CRATE_VERSION=${version_tag#v}" >> $GITHUB_ENV
          echo "VERSION_TAG=${version_tag}" >> $GITHUB_ENV

      - name: Upload assets (create/update release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          tag='${{ env.VERSION_TAG }}'
          # Create release if missing (empty notes/title)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" -t "$tag" -n ""
          # Proactively delete existing assets with same names to avoid stale bytes
          for f in out/barretenberg-*.tar.gz; do
            name=$(basename "$f")
            gh release delete-asset "$tag" "$name" --yes || true
          done
          # Upload fresh tarballs
          gh release upload "$tag" out/barretenberg-*.tar.gz --clobber



  consumer-test:
    name: Consumer test (Linux x86_64)
    needs: build
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve crate version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version_tag='${{ inputs.version }}'
          elif [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            version_tag='${{ github.ref_name }}'
          else
            crate_version=$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' crates/aztec-barretenberg-sys-rs/Cargo.toml)
            version_tag="v${crate_version}"
          fi
          echo "VERSION_TAG=${version_tag}" >> $GITHUB_ENV

      - name: Install Rust (stable)
        run: |
          set -eux
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Test crypto-only consumer without prover graph
        env:
          BB_USE_PREBUILT: "1"
          BB_PREBUILT_VERSION: ${{ env.VERSION_TAG }}
          BB_PREBUILT_CACHE_DIR: ${{ github.workspace }}/target/bb-crypto-only-prebuilt
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/bb-crypto-only-build
        run: |
          set -euxo pipefail
          asset="barretenberg-crypto-${VERSION_TAG}-${TARGET}.tar.gz"
          found=$(find artifacts -type f -name "$asset" | head -n1 || true)
          if [ -z "$found" ]; then
            echo "Artifact $asset not found in artifacts/" >&2
            ls -R artifacts >&2 || true
            exit 1
          fi
          cache_dir="${BB_PREBUILT_CACHE_DIR}/${VERSION_TAG}/${TARGET}"
          mkdir -p "$cache_dir"
          tar -xzf "$found" -C "$cache_dir"

          consumer="target/bb-crypto-only-consumer"
          mkdir -p "$consumer/src"
          cat > "$consumer/Cargo.toml" <<'EOF'
          [package]
          name = "bb-crypto-only-consumer"
          version = "0.0.0"
          edition = "2021"

          [workspace]

          [dependencies]
          aztec-barretenberg-crypto-sys-rs = { path = "../../crates/aztec-barretenberg-crypto-sys-rs" }
          EOF
          cat > "$consumer/src/lib.rs" <<'EOF'
          #[cfg(test)]
          mod tests {
              #[test]
              fn links_crypto_ffi_without_prover() {
                  let input = [0_u8; 128];
                  let mut output = std::ptr::null_mut();
                  let mut output_len = 0;
                  let status = unsafe {
                      aztec_barretenberg_crypto_sys_rs::bb_poseidon2_permutation_bn254(
                          input.as_ptr(),
                          4,
                          &mut output,
                          &mut output_len,
                      )
                  };
                  assert_eq!(status, 0);
                  assert_eq!(output_len, 128);
                  assert!(!output.is_null());
                  unsafe { aztec_barretenberg_crypto_sys_rs::bb_free(output) };
              }
          }
          EOF

          cargo test --manifest-path "$consumer/Cargo.toml"
          treefile=$(mktemp -t cargo-tree.XXXXXX)
          cargo tree --manifest-path "$consumer/Cargo.toml" --prefix none > "$treefile"
          grep -Eq '^aztec-barretenberg-crypto-sys-rs v' "$treefile" || \
            { echo "ERROR: crypto sys crate missing from crypto-only graph" >&2; cat "$treefile" >&2; exit 1; }
          ! grep -Eq '^aztec-barretenberg-sys-rs v|^aztec-barretenberg-rs v' "$treefile" || \
            { echo "ERROR: crypto-only graph unexpectedly contains prover/full wrapper" >&2; cat "$treefile" >&2; exit 1; }
          rm -f "$treefile"

      - name: Prepare prebuilt cache
        run: |
          set -euxo pipefail
          cache_dir="target/bb-prebuilt/${VERSION_TAG}/${TARGET}"
          mkdir -p "$cache_dir"
          for component in crypto prover; do
            asset="barretenberg-${component}-${VERSION_TAG}-${TARGET}.tar.gz"
            found=$(find artifacts -type f -name "$asset" | head -n1 || true)
            if [ -z "$found" ]; then
              echo "Artifact $asset not found in artifacts/" >&2
              ls -R artifacts >&2 || true
              exit 1
            fi
            tar -xzf "$found" -C "$cache_dir"
          done
          echo "$VERSION_TAG" > "$cache_dir/VERSION"

      - name: Validate public header include paths
        run: |
          set -euxo pipefail
          cache_dir="target/bb-prebuilt/${VERSION_TAG}/${TARGET}"
          cat > /tmp/bb_public_header_check.cpp <<'EOF'
          #include "barretenberg/ecc/curves/bn254/g1.hpp"
          #include "barretenberg/ecc/curves/bn254/g2.hpp"
          #include "barretenberg/ecc/curves/grumpkin/grumpkin.hpp"
          #include "barretenberg/srs/global_crs.hpp"
          int main() { return 0; }
          EOF
          common_flags=(-std=c++20 -DDISABLE_ASM=1 -DMSGPACK_NO_BOOST -DMSGPACK_USE_STD_VARIANT_ADAPTOR)
          c++ "${common_flags[@]}" -I "$cache_dir/include" -fsyntax-only /tmp/bb_public_header_check.cpp
          c++ "${common_flags[@]}" \
            -I "$cache_dir/include" \
            -I "$cache_dir/include-deps/msgpack" \
            -fsyntax-only /tmp/bb_public_header_check.cpp

      - name: Build Rust crate against prebuilts
        env:
          BB_USE_PREBUILT: "1"
          BB_PREBUILT_VERSION: ${{ env.VERSION_TAG }}
        run: |
          cargo build -p aztec-barretenberg-rs

      - name: Verify full split executable link
        env:
          BB_USE_PREBUILT: "1"
          BB_PREBUILT_VERSION: ${{ env.VERSION_TAG }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euxo pipefail
          consumer="target/bb-full-link-consumer"
          mkdir -p "$consumer/src"
          cat > "$consumer/Cargo.toml" <<'EOF'
          [package]
          name = "bb-full-link-consumer"
          version = "0.0.0"
          edition = "2021"

          [workspace]

          [dependencies]
          aztec-barretenberg-sys-rs = { path = "../../crates/aztec-barretenberg-sys-rs" }
          EOF
          cat > "$consumer/src/main.rs" <<'EOF'
          fn main() {
              let crypto = aztec_barretenberg_sys_rs::bb_poseidon2_permutation_bn254 as usize;
              let prover = aztec_barretenberg_sys_rs::srs_init_srs as usize;
              assert_ne!(crypto, 0);
              assert_ne!(prover, 0);
          }
          EOF
          cargo run --manifest-path "$consumer/Cargo.toml"

      - name: Verify native symbols survive Rust staticlib packaging
        env:
          BB_USE_PREBUILT: "1"
          BB_PREBUILT_VERSION: ${{ env.VERSION_TAG }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euxo pipefail
          consumer="target/bb-staticlib-consumer"
          mkdir -p "$consumer/src"
          cat > "$consumer/Cargo.toml" <<'EOF'
          [package]
          name = "bb-staticlib-consumer"
          version = "0.0.0"
          edition = "2021"

          [workspace]

          [lib]
          crate-type = ["staticlib"]

          [dependencies]
          aztec-barretenberg-sys-rs = { path = "../../crates/aztec-barretenberg-sys-rs" }
          EOF
          cat > "$consumer/src/lib.rs" <<'EOF'
          #[no_mangle]
          pub extern "C" fn bb_staticlib_crypto_symbol() -> usize {
              aztec_barretenberg_sys_rs::bb_poseidon2_permutation_bn254 as usize
          }

          #[no_mangle]
          pub extern "C" fn bb_staticlib_prover_symbol() -> usize {
              aztec_barretenberg_sys_rs::srs_init_srs as usize
          }
          EOF

          cargo build --manifest-path "$consumer/Cargo.toml"
          staticlib="target/debug/libbb_staticlib_consumer.a"
          if [ ! -f "$staticlib" ]; then
            echo "ERROR: Rust staticlib was not produced at $staticlib" >&2
            exit 1
          fi
          symbols=$(mktemp -t staticlib-symbols.XXXXXX)
          nm -g --defined-only "$staticlib" > "$symbols"
          grep -Eq '[[:space:]]bb_poseidon2_permutation_bn254$' "$symbols" || \
            { echo "ERROR: staticlib is missing the BB crypto definition" >&2; exit 1; }
          grep -Eq '[[:space:]]srs_init_srs$' "$symbols" || \
            { echo "ERROR: staticlib is missing the BB prover definition" >&2; exit 1; }
          rm -f "$symbols"

