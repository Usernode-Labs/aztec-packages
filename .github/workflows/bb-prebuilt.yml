      - name: Install Rust (stable)
        run: |
          set -eux
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add ${TARGET}

      - name: Install Android NDK
        run: |
          set -euxo pipefail
          NDK_VERSION=r26d
          NDK_ZIP=android-ndk-${NDK_VERSION}-linux.zip
          curl -fsSL https://dl.google.com/android/repository/${NDK_ZIP} -o ${NDK_ZIP}
          unzip -q ${NDK_ZIP} -d $HOME
          rm -f ${NDK_ZIP}
          ndk_dir=$(echo $HOME/android-ndk-*)
          echo "ANDROID_NDK=$ndk_dir" >> $GITHUB_ENV
          echo "ANDROID_API=28" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare prebuilt cache
        run: |
          set -euxo pipefail
          cache_dir="target/bb-prebuilt/${VERSION_TAG}/${TARGET}"
          mkdir -p "$cache_dir"
          for component in crypto prover; do
            asset="barretenberg-${component}-${VERSION_TAG}-${TARGET}.tar.gz"
            found=$(find artifacts -type f -name "$asset" | head -n1 || true)
            if [ -z "$found" ]; then
              echo "Artifact $asset not found in artifacts/" >&2
              ls -R artifacts >&2 || true
              exit 1
            fi
            tar -xzf "$found" -C "$cache_dir"
          done
          echo "$VERSION_TAG" > "$cache_dir/VERSION"

      - name: Build Rust crate against prebuilts (Android)
        env:
          BB_USE_PREBUILT: "1"
          BB_PREBUILT_VERSION: ${{ env.VERSION_TAG }}
        run: |
          set -euxo pipefail
          target="${TARGET}"
          ndk="${ANDROID_NDK}"
          api="${ANDROID_API:-28}"
          toolchain="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "$target" in
            aarch64-linux-android)
              clang_target="aarch64-linux-android${api}"
              ;;
            x86_64-linux-android)
              clang_target="x86_64-linux-android${api}"
              ;;
            *)
              echo "Unsupported Android target $target" >&2
              exit 1
              ;;
          esac
          env_suffix=${target//-/_}
          env_upper=$(echo "$env_suffix" | tr '[:lower:]' '[:upper:]')
          export CC_${env_suffix}="${toolchain}/${clang_target}-clang"
          export CXX_${env_suffix}="${toolchain}/${clang_target}-clang++"
          export AR_${env_suffix}="${toolchain}/llvm-ar"
          export RANLIB_${env_suffix}="${toolchain}/llvm-ranlib"
          export CARGO_TARGET_${env_upper}_LINKER="${toolchain}/${clang_target}-clang"
          export CARGO_TARGET_${env_upper}_AR="${toolchain}/llvm-ar"
          export CARGO_TARGET_${env_upper}_RANLIB="${toolchain}/llvm-ranlib"
          export PKG_CONFIG_ALLOW_CROSS=1
          cargo build --target "$target" -p aztec-barretenberg-rs

