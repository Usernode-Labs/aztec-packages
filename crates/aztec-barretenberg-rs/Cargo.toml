[package]
name = "aztec-barretenberg-rs"
version = "4.2.0-aztecnr-rc.2-usernode.9"
edition = "2021"
license = "MIT"
description = "Safe Rust API for Barretenberg MegaHonk proving/verification and merge; ACVM execution always on."

[dependencies]
aztec-barretenberg-sys-rs = { path = "../aztec-barretenberg-sys-rs", version = "4.2.0-aztecnr-rc.2-usernode.9" }
thiserror = "1"

# ACVM stack for witness execution (always enabled)
acvm = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.14", default-features = false, features = ["bn254"] }
acir = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.14", default-features = false, features = ["bn254"] }
acvm_blackbox_solver = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.14", default-features = false, features = ["bn254"] }
acir_field = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.14" }
brillig = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.14" }
bincode = { version = "1" }
flate2 = { version = "1", features = ["rust_backend"] }

[dev-dependencies]
serde_json = "1"
base64 = "0.22"
flate2 = { version = "1", features = ["rust_backend"] }
acir = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.14", default-features = false, features = ["bn254"] }
acvm = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.14", default-features = false, features = ["bn254"] }
bincode = "1"
toml = "0.8"
hex = "0.4"
serial_test = "2"
